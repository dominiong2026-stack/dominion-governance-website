name: Render meditation audio

on:
  push:
    paths:
      - 'meditation.txt'
      - '.github/workflows/render-meditation.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install neural TTS runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'kokoro-onnx==0.6.1' soundfile numpy scipy
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Download official Kokoro model files
        run: |
          curl -L --fail --retry 3 -o kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.onnx
          curl -L --fail --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
      - name: Render and master
        run: |
          cat > render.py <<'PY'
          import re, math
          from pathlib import Path
          import numpy as np
          import soundfile as sf
          from scipy.signal import butter, sosfilt
          from kokoro_onnx import Kokoro

          SR=24000
          VOICE='am_michael'
          SPEED=0.88
          text=Path('meditation.txt').read_text(encoding='utf-8')
          pause_re=re.compile(r'\[PAUSE\s+([0-9]+(?:\.[0-9]+)?)s\]',re.I)
          parts=[]; pos=0
          for m in pause_re.finditer(text):
              if m.start()>pos:
                  s=text[pos:m.start()].strip()
                  if s: parts.append(('text',s))
              parts.append(('pause',float(m.group(1))))
              pos=m.end()
          if pos < len(text):
              s=text[pos:].strip()
              if s: parts.append(('text',s))

          kokoro=Kokoro('kokoro-v1.0.onnx','voices-v1.0.bin')
          chunks=[]
          for kind,val in parts:
              if kind=='pause':
                  chunks.append(np.zeros(int(val*SR),dtype=np.float32))
              else:
                  a,sr=kokoro.create(val,voice=VOICE,speed=SPEED,lang='en-us')
                  a=np.asarray(a,dtype=np.float32).reshape(-1)
                  if sr != SR:
                      raise RuntimeError(f'unexpected sample rate {sr}')
                  chunks.append(a)
          voice=np.concatenate(chunks)

          # gentle voice cleanup
          sos=butter(2,70,btype='highpass',fs=SR,output='sos')
          voice=sosfilt(sos,voice).astype(np.float32)
          peak=np.max(np.abs(voice)) or 1.0
          voice=voice*(0.78/peak)
          sf.write('narration.wav',voice,SR,subtype='PCM_24')

          # target 17 min or narration+25 sec, whichever is longer
          dur=max(17*60, len(voice)/SR + 25)
          n=int(dur*SR)
          t=np.arange(n,dtype=np.float32)/SR
          # binaural separation: 10 Hz -> 7.5 -> 6 -> 8.5
          bp=np.empty(n,dtype=np.float32)
          for i,tt in enumerate(t):
              if tt<180: d=10-(2.5*tt/180)
              elif tt<420: d=7.5-(1.5*(tt-180)/240)
              elif tt<840: d=6.0
              else: d=6.0+2.5*min(1,(tt-840)/180)
              bp[i]=d
          carrier=174.0
          phaseL=2*np.pi*carrier*t
          phaseR=2*np.pi*(carrier+bp)*t
          binaural=np.stack([np.sin(phaseL),np.sin(phaseR)],axis=1)*0.018
          # warm harmonic drone with very slow breathing envelope
          env=0.55+0.45*np.sin(2*np.pi*t/22.0)**2
          drone=(0.55*np.sin(2*np.pi*87.0*t)+0.28*np.sin(2*np.pi*130.5*t)+0.17*np.sin(2*np.pi*261.0*t))*env
          drone=np.stack([drone,drone],axis=1)*0.024
          bed=(binaural+drone).astype(np.float32)
          fade=int(8*SR)
          ramp=np.linspace(0,1,fade,dtype=np.float32)
          bed[:fade]*=ramp[:,None]
          bed[-fade:]*=ramp[::-1,None]

          # narration stereo + gentle ducking beneath speech
          vst=np.zeros((n,2),dtype=np.float32)
          L=min(len(voice),n)
          vst[:L,0]=voice[:L]; vst[:L,1]=voice[:L]
          # activity envelope from absolute voice, smoothed ~120ms
          act=np.zeros(n,dtype=np.float32); act[:L]=np.abs(voice[:L])
          win=max(1,int(.12*SR)); ker=np.ones(win,dtype=np.float32)/win
          sm=np.convolve(act,ker,mode='same')
          sm=np.clip(sm/0.09,0,1)
          duck=(1-0.48*sm)[:,None]
          mix=vst + bed*duck
          # master conservatively
          p=np.max(np.abs(mix)) or 1.0
          mix*=min(1.0,0.76/p)
          sf.write('Friend_of_Mammon_Tonglen_Neural_FINAL.wav',mix,SR,subtype='PCM_24')
          print('duration_sec',n/SR,'peak',float(np.max(np.abs(mix))))
          PY
          python render.py
          ffmpeg -y -hide_banner -loglevel error -i Friend_of_Mammon_Tonglen_Neural_FINAL.wav -codec:a libmp3lame -b:a 320k Friend_of_Mammon_Tonglen_Neural_FINAL.mp3
          ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 Friend_of_Mammon_Tonglen_Neural_FINAL.wav
      - uses: actions/upload-artifact@v4
        with:
          name: Friend-of-Mammon-Neural-Meditation
          path: |
            Friend_of_Mammon_Tonglen_Neural_FINAL.wav
            Friend_of_Mammon_Tonglen_Neural_FINAL.mp3
            narration.wav
          retention-days: 1
